pluginManagement {
  repositories {
    gradlePluginPortal()
    mavenCentral()
  }
}

plugins {
  // Portable JDK-21 toolchain provisioning (no committed machine-specific path); pairs with JAVA_HOME.
  id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

dependencyResolutionManagement {
  repositories {
    mavenCentral()
  }
}

rootProject.name = 'wc-api'

include 'shared', 'api', 'worker'
