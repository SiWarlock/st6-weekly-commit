# aws (deployed): the profile EVERY k8s workload runs (SPRING_PROFILES_ACTIVE=aws — deployment-api
# :40, worker, migration Job, cronjob). Real SNS/SQS/Graph + datasource + Auth0. flyway stays off on
# the api (the migration Job is the sole schema owner — forbidden-#3). Real mode (demo-auth.enabled
# inherits the base default false).
#
# Datasource + auth0 come from the wc-api-secrets CSI mount (§12 / Appendix D): each Secrets Manager
# key is mounted as a file named by the property key under /mnt/secrets/ (spring.datasource.url /
# username / password, spring.security.oauth2.resourceserver.jwt.issuer-uri, auth0.audience), so ONE
# configtree import binds them all directly — the HikariDataSource then auto-configures. `optional:`
# so local/demo (no mount) still boot. Mount values take precedence over the literal defaults below,
# so the app boots with a correct audience even before the secret is HITL-populated.
spring:
  config:
    import: optional:configtree:/mnt/secrets/
  jpa:
    hibernate:
      # The migration Job owns the schema; the app validates entities↔schema at boot and fails fast
      # on drift. Never update/create (forbidden — single schema owner).
      ddl-auto: validate
  datasource:
    hikari:
      # Prod pool (NOT the §29 test cap of 2). url/username/password bind from the CSI mount above.
      maximum-pool-size: 10
      connection-timeout: 30000

# Auth0 audience for the custom AudienceValidator (§6 — Auth0 does not validate aud by default). A
# sane default; the CSI mount's auth0.audience (the real API identifier, HITL-populated) overrides via
# configtree precedence. issuer-uri likewise comes from the mount (base default ${AUTH0_ISSUER_URI:}).
auth0:
  audience: https://api.wc.${ROOT_DOMAIN:localhost}

app:
  # The deployment env — feeds the SyncJobPointer.env field (SnsLifecyclePublisher reads
  # ${app.env:local}); "aws" so the published pointer is correct end-to-end (Wave-2 s7). Single-env
  # demo, so the literal is correct; local/demo/test leave it unset → the :local default applies.
  env: aws
  # Real SNS lifecycle publish (Wave-2 s7, §10): the topic ARN gates the real AwsSnsLifecycleGateway
  # (the logging stub is the bean when this is absent). Bound from the deployment env (deployment-api
  # .yaml SNS_TOPIC_ARN); the AWS region resolves from AWS_REGION (base spring.cloud.aws.region.static).
  sns:
    # Empty default so the placeholder ALWAYS resolves: the aws-profile Jobs (migration / generate-
    # plan-shells / rebuild-projections) run SPRING_PROFILES_ACTIVE=aws but are never given
    # SNS_TOPIC_ARN (API-Deployment-only), and a no-default ${SNS_TOPIC_ARN} crashes their boot at
    # condition-eval (the gateway @ConditionalOnExpression is evaluated for EVERY aws context). Empty
    # -> the no-op stub; non-empty (the API) -> the real AwsSnsLifecycleGateway (deploy-fix #5b).
    topic-arn: ${SNS_TOPIC_ARN:}
  # Prod CORS allow-list: the deployed SPA origin only (exact, no wildcard, no dev origin — §16). An
  # explicit CORS_ALLOWED_ORIGINS env still wins (multi-origin via comma-separated).
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://wc.${ROOT_DOMAIN:localhost}}

logging:
  level:
    com.st6.wc: INFO
