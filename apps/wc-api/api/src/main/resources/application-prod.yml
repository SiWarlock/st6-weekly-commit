# prod (aws): real SNS/SQS/Graph + datasource + Auth0 wired in later phases. flyway stays off (Migration Job owns it).
# Real mode (demo-auth.enabled inherits the base default false). issuer-uri comes from Secrets Manager
# (base ${AUTH0_ISSUER_URI:}); audience is the deployed API identifier (Appendix D.2).
auth0:
  audience: https://api.wc.${ROOT_DOMAIN}

# Prod CORS allow-list: the deployed SPA origin only (exact, no wildcard, no dev origin — §16). An
# explicit CORS_ALLOWED_ORIGINS env still wins (multi-origin via comma-separated).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://wc.${ROOT_DOMAIN}}

logging:
  level:
    com.st6.wc: INFO
