plugins {
  alias(libs.plugins.spring.boot)
}

// :api — Spring Boot 3.3 app (WcApiApplication + actuator probes). Depends on :shared
// (shared<-api); NO dependency on :worker (REQ-O-016). No domain/auth/CORS/SNS yet.
dependencies {
  implementation platform("org.springframework.boot:spring-boot-dependencies:${libs.versions.springBoot.get()}")
  // Spring Cloud AWS BOM (Wave-2 s7) — version-manages the SNS starter + AWS SDK v2 for the real
  // LifecycleSnsGateway. 3.2.x line is Boot-3.3-compatible (libs.versions.toml).
  implementation platform("io.awspring.cloud:spring-cloud-aws-dependencies:${libs.versions.springCloudAws.get()}")

  implementation project(':shared')

  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'

  // SNS publish for the lifecycle pointer (Wave-2 s7, §10) — SnsTemplate auto-config + AWS SDK v2.
  implementation 'io.awspring.cloud:spring-cloud-aws-starter-sns'

  // Auth0 JWT validation (task 2.1): OAuth2 Resource Server brings spring-security-oauth2-jose +
  // nimbus-jose-jwt (the JwtDecoder/validators). NOTE: this activates Spring Security's default
  // filter chain (secures all endpoints incl. actuator probes) for full-context @SpringBootTest —
  // the DB-less skeleton boot tests opt out via spring.autoconfigure.exclude of the security
  // autoconfigs (the real SecurityFilterChain is task 2.6, not here).
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

  // JPA runtime (task 1.5): Hibernate + Spring Data for the :shared entities/repos. Phase 2/3
  // services need this at runtime anyway. NOTE: adding this activates DataSourceAutoConfiguration
  // for full-context @SpringBootTest — the two DB-less skeleton boot tests opt out via a test-local
  // spring.autoconfigure.exclude (they assert actuator/clock/profile, not persistence).
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

  // Jakarta Bean Validation (task 3.4a): Hibernate Validator + the @Valid request-DTO validation
  // (Appendix E Part 1 — code-point caps, @NotBlank/@NotNull, the custom @CodePointSize/@NoControlChars).
  implementation 'org.springframework.boot:spring-boot-starter-validation'

  // Production runtime classpath (deploy-fix #6): these were testImplementation-only (Testcontainers)
  // so they were ABSENT from the bootJar — the migration Job (real PG, outside Testcontainers) failed
  // "Failed to load driver class org.postgresql.Driver" at datasource init. Ship them in the bootJar:
  //   - postgresql: the JDBC driver (the api Deployment's own datasource + the migration Job).
  //   - flyway-core: the migration engine — the flyway-migrate Job runs it (autoconfig-loaded; flyway
  //     stays disabled in every other profile, so this is inert there). [audit: was test-only too.]
  //   - flyway-database-postgresql: Flyway 10 split PG support out of flyway-core (Boot 3.3).
  // BOM-versioned (no explicit version). testImplementation stays for the test classpath (compile).
  runtimeOnly 'org.postgresql:postgresql'
  runtimeOnly 'org.flywaydb:flyway-core'
  runtimeOnly 'org.flywaydb:flyway-database-postgresql'

  // IRSA runtime (deploy-fix-sts, §48 — 3rd prod-runtime-classpath gap of this class): AWS SDK v2
  // IRSA auth (WebIdentityTokenCredentialsProvider → AssumeRoleWithWebIdentity) needs
  // software.amazon.awssdk:sts on the classpath, but spring-cloud-aws-starter-sns (above) does NOT
  // pull it transitively → on the cluster the lock-time sns:Publish can't assume the role, and the
  // §28 rule-#4 swallow masks it (records stick at PENDING_PUBLISH). BOM-versioned (no explicit
  // version — the spring-cloud-aws-dependencies BOM imports the AWS SDK v2 BOM). Pinned by Gate 7.
  runtimeOnly 'software.amazon.awssdk:sts'

  compileOnly libs.lombok
  annotationProcessor libs.lombok

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.security:spring-security-test' // task 2.1
  // task 2.1: stub the Auth0 OIDC discovery endpoint so the real-mode JwtDecoder bean
  // (eager withIssuerLocation discovery) can be built + tested without a live Auth0 tenant.
  testImplementation 'com.squareup.okhttp3:mockwebserver' // version via Spring Boot BOM

  // JPA entity round-trip/mapping tests (task 1.5): real PG16 via Testcontainers + Flyway V1-V3,
  // ddl-auto=validate. testcontainers-bom 1.21.4 stays pinned NEWER than the spring-boot-dependencies
  // default for Docker Engine 29 compatibility (LESSONS §5). Migration scripts resolve from :shared.
  testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
  testImplementation 'org.flywaydb:flyway-core'
  testImplementation 'org.flywaydb:flyway-database-postgresql'
  testImplementation 'org.postgresql:postgresql'
  testImplementation 'org.testcontainers:postgresql'
  testImplementation 'org.testcontainers:junit-jupiter'
}
