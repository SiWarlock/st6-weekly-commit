// :shared — enum vocabulary, common base entities, time config; depended on by :api and :worker
// (shared<-api, shared<-worker). Spring Boot BOM aligns Spring/jakarta versions with the 3.3.5 pin.
dependencies {
  implementation platform("org.springframework.boot:spring-boot-dependencies:${libs.versions.springBoot.get()}")

  compileOnly libs.lombok
  annotationProcessor libs.lombok

  implementation libs.jakarta.persistence.api
  implementation libs.jakarta.validation.api
  implementation 'org.springframework:spring-context' // ClockConfig @Configuration/@Bean

  testImplementation 'org.springframework.boot:spring-boot-starter-test' // ClockConfig context test

  // Flyway migration + Testcontainers PG16 harness (task 1.2). :shared owns db/migration/.
  // The :api FlywayMigrateRunner adds runtime flyway-core in a later phase; here it is test-scope.
  // Testcontainers BOM is pinned NEWER than the spring-boot-dependencies default (1.19.x) so its
  // bundled docker-java can talk to the local Docker Engine 29 API (older docker-java 400s on /info).
  testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
  testImplementation 'org.flywaydb:flyway-core'
  testImplementation 'org.flywaydb:flyway-database-postgresql'
  testImplementation 'org.postgresql:postgresql'
  testImplementation 'org.testcontainers:postgresql'
  testImplementation 'org.testcontainers:junit-jupiter'
}
