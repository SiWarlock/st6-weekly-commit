# aws (deployed): the profile the worker Deployment runs (SPRING_PROFILES_ACTIVE=aws —
# deployment-worker.yaml). Wave-2 s8: the worker now consumes the wc-sync queue + reloads the
# SyncRecord from the DB. The datasource binds from the wc-worker-secrets CSI mount (db keys added
# by the paired infra seam) via configtree (LESSONS §42); flyway stays off (the migration Job owns
# the schema — forbidden-#3). app.sqs.queue-url gates + targets the @SqsListener (active in aws only).
spring:
  config:
    import: optional:configtree:/mnt/secrets/
app:
  sqs:
    # The wc-sync queue URL (deployment-worker.yaml SQS_QUEUE_URL) — gates the @SqsListener (only the
    # deployed worker polls) and is its target.
    queue-url: ${SQS_QUEUE_URL}
    # Stale-SYNCING reclaim lease (brief 104): a SYNCING row idle longer than this is reclaimable on
    # redelivery (a crashed claimer); an active claimer's recent attempt is NOT reclaimed. MUST
    # exceed the SQS visibility timeout (infra) so a slow active claimer's redelivery can't reclaim
    # it mid-flight. ISO-8601 duration; tunable via SYNC_CLAIM_LEASE. Matches the listener's @Value
    # default (PT5M).
    sync-claim-lease: ${SYNC_CLAIM_LEASE:PT5M}
    # Stale-SYNCING reaper (brief 104b): the @Scheduled reaper re-enqueues stale-SYNCING rows
    # (lastAttemptAt < now − sync-claim-lease) onto this queue so the listener's lease clause
    # reclaims them — the re-trigger the no-op-ACK-deleted message can't provide. Interval a fraction
    # of the lease (catches a stranded row promptly, not wastefully); batch bounds one tick's
    # re-enqueue. Inert until infra grants the worker sqs:SendMessage on wc-sync.
    reaper-interval: ${REAPER_INTERVAL:PT1M}
    reaper-batch-size: ${REAPER_BATCH_SIZE:100}
logging:
  level:
    com.st6.wc.worker: INFO
