<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css?v=3">
<style>
  html,body{margin:0}
  body{background:var(--surface-app);padding:24px 26px}
  .ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border)}
  .sw{height:64px;display:flex;align-items:flex-end;padding:6px}
  .sw span{font-size:9px;font-family:var(--font-mono)}
  .lite span{color:#000}.dark span{color:var(--n-700)}
  .lab{display:flex;justify-content:space-between;margin-top:12px;color:var(--ink-secondary);font-size:12px}
</style>
</head>
<body class="ds-scope">
  <div class="ramp">
    <div class="sw dark" style="background:var(--n-0)"><span>0</span></div>
    <div class="sw dark" style="background:var(--n-100)"><span>100</span></div>
    <div class="sw dark" style="background:var(--n-200)"><span>200</span></div>
    <div class="sw dark" style="background:var(--n-300)"><span>300</span></div>
    <div class="sw dark" style="background:var(--n-400)"><span>400</span></div>
    <div class="sw lite" style="background:var(--n-500)"><span>500</span></div>
    <div class="sw lite" style="background:var(--n-600)"><span>600</span></div>
    <div class="sw lite" style="background:var(--n-700)"><span>700</span></div>
    <div class="sw lite" style="background:var(--n-800)"><span>800</span></div>
    <div class="sw lite" style="background:var(--n-900)"><span>900</span></div>
  </div>
  <div class="lab"><span>#08090A · app background</span><span>#F7F8F8 · primary ink</span></div>
</body>
</html>
