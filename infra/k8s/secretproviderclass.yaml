# secretproviderclass.yaml — per-workload Secrets Store CSI + AWS provider (ASCP)
# secret mounts (§12, Appendix D). ONE SecretProviderClass per ServiceAccount; each
# exposes ONLY the secrets that SA's 12.7b IRSA role permits — the manifest mirrors
# the IRSA least-privilege (defense-in-depth): api→db/auth0/graph, worker→db/graph,
# cronjob→db, migration→db.
#
# Each `jmesPath` entry extracts one contract key (the 12.6 secret JSON keys) into a
# file named identically (objectAlias) under the CSI mount (/mnt/secrets), so Spring
# reads them as a config tree: spring.config.import=optional:configtree:/mnt/secrets/
# (Appendix D — the mount-file name == the property key). Dotted property keys are
# double-quoted in the JMESPath expression so the literal dotted key is one node.
#
# Secret ARNs are TF outputs injected at deploy via the ${...} tokens + CI envsubst.
# NOTE: no `secretObjects:` block — secrets are mounted as tmpfs files only, never
# synced into a k8s Secret (etcd). Values stay in Secrets Manager; pods read the
# mounted file (rule #7 — secrets never materialize outside Secrets Manager + the mount).
#
# The `objects` value is a YAML *string* (ASCP contract) — kubeconform skips this CRD
# (-ignore-missing-schemas); the structural assertion is human/CI-side.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: wc-api-secrets
  namespace: wc
  labels:
    app.kubernetes.io/part-of: wc
    app.kubernetes.io/component: api
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "${DB_SECRET_ARN}"
        objectType: "secretsmanager"
        jmesPath:
          - path: '"spring.datasource.url"'
            objectAlias: "spring.datasource.url"
          - path: '"spring.datasource.username"'
            objectAlias: "spring.datasource.username"
          - path: '"spring.datasource.password"'
            objectAlias: "spring.datasource.password"
      - objectName: "${AUTH0_SECRET_ARN}"
        objectType: "secretsmanager"
        jmesPath:
          - path: '"spring.security.oauth2.resourceserver.jwt.issuer-uri"'
            objectAlias: "spring.security.oauth2.resourceserver.jwt.issuer-uri"
          - path: '"auth0.audience"'
            objectAlias: "auth0.audience"
      - objectName: "${GRAPH_SECRET_ARN}"
        objectType: "secretsmanager"
        jmesPath:
          - path: "GRAPH_TENANT_ID"
            objectAlias: "GRAPH_TENANT_ID"
          - path: "GRAPH_CLIENT_ID"
            objectAlias: "GRAPH_CLIENT_ID"
          - path: "GRAPH_CLIENT_SECRET"
            objectAlias: "GRAPH_CLIENT_SECRET"
---
# worker — DB (datasource) + GRAPH secrets (mirrors irsa_worker: GetSecretValue on db + graph).
# DB added Wave-2 (s8): the worker reloads OutlookCalendarSyncRecord by id, so it binds
# spring.datasource.* via configtree — the SAME db secret + keys as the api (byte-identical block).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: wc-worker-secrets
  namespace: wc
  labels:
    app.kubernetes.io/part-of: wc
    app.kubernetes.io/component: worker
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "${DB_SECRET_ARN}"
        objectType: "secretsmanager"
        jmesPath:
          - path: '"spring.datasource.url"'
            objectAlias: "spring.datasource.url"
          - path: '"spring.datasource.username"'
            objectAlias: "spring.datasource.username"
          - path: '"spring.datasource.password"'
            objectAlias: "spring.datasource.password"
      - objectName: "${GRAPH_SECRET_ARN}"
        objectType: "secretsmanager"
        jmesPath:
          - path: "GRAPH_TENANT_ID"
            objectAlias: "GRAPH_TENANT_ID"
          - path: "GRAPH_CLIENT_ID"
            objectAlias: "GRAPH_CLIENT_ID"
          - path: "GRAPH_CLIENT_SECRET"
            objectAlias: "GRAPH_CLIENT_SECRET"
---
# cronjob — DB secret ONLY (mirrors irsa_cronjob: GetSecretValue on db only).
