# serviceaccount-api.yaml — wc-api SA, bound to its 12.7b IRSA role (sns:Publish +
# GetSecretValue on db/auth0/graph). Name MUST equal the IRSA trust `sub`
# (system:serviceaccount:wc:wc-api). role-arn is a TF output injected at deploy via
# the ${...} token + CI envsubst (12.11) — kubeconform validates the structure as a string.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wc-api
  namespace: wc
  labels:
    app.kubernetes.io/part-of: wc
    app.kubernetes.io/component: api
  annotations:
    eks.amazonaws.com/role-arn: ${IRSA_API_ROLE_ARN}
