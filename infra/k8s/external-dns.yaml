# external-dns.yaml — Decision 2 (docs/decisions/001). external-dns owns the
# api.wc.${ROOT_DOMAIN} -> ALB alias Route53 record: the ALB is created by the AWS
# Load Balancer Controller from ingress-api.yaml at deploy time (post-`terraform
# apply`), so the alias can't be a pure-Terraform record. external-dns watches the
# Ingress hostname annotation and upserts the record.
#
# Components: SA (bound to the hosted-zone-scoped, ci_boundary-bounded IRSA role from
# iam_irsa.tf) + ClusterRole/Binding (watch ingresses/services to read the desired
# DNS) + the Deployment. RBAC is included because the SA cannot read Ingresses without
# it — a Deployment+SA alone would be non-functional.
#
# --policy=upsert-only: external-dns only creates/updates records, never deletes —
# it cannot remove a record it didn't create (safe). --registry=txt + --txt-owner-id
# tag ownership so only this instance manages its records. --domain-filter scopes it
# to the project zone. ${EXTERNAL_DNS_ROLE_ARN} + ${ROOT_DOMAIN} injected via CI envsubst.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: wc
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/part-of: wc
  annotations:
    eks.amazonaws.com/role-arn: ${EXTERNAL_DNS_ROLE_ARN}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/part-of: wc
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns-viewer
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/part-of: wc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: wc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: wc
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/part-of: wc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
    spec:
      serviceAccountName: external-dns
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.21.0
          args:
            - --source=ingress
            - --domain-filter=${ROOT_DOMAIN}
            - --provider=aws
            - --policy=upsert-only
            - --registry=txt
            - --txt-owner-id=wc
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
