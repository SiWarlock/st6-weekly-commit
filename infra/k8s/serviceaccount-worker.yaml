# serviceaccount-worker.yaml — wc-sync-worker SA, bound to its 12.7b IRSA role
# (sqs Receive/Delete/GetQueueAttributes on queue+DLQ + GetSecretValue on GRAPH ONLY).
# Name MUST equal the IRSA trust `sub` (system:serviceaccount:wc:wc-worker).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wc-worker
  namespace: wc
  labels:
    app.kubernetes.io/part-of: wc
    app.kubernetes.io/component: worker
  annotations:
    eks.amazonaws.com/role-arn: ${IRSA_WORKER_ROLE_ARN}
