# serviceaccount-cronjob.yaml — generation-CronJob SA, bound to its 12.7b IRSA role
# (GetSecretValue on DB ONLY). Name MUST equal the IRSA trust `sub`
# (system:serviceaccount:wc:wc-cronjob). Reuses the wc-api image (no third image).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wc-cronjob
  namespace: wc
  labels:
    app.kubernetes.io/part-of: wc
    app.kubernetes.io/component: cronjob
  annotations:
    eks.amazonaws.com/role-arn: ${IRSA_CRONJOB_ROLE_ARN}
