# serviceaccount-migration.yaml — pre-deploy migration-Job SA, bound to its 12.7b
# IRSA role (GetSecretValue on DB ONLY). Name MUST equal the IRSA trust `sub`
# (system:serviceaccount:wc:wc-migration). Sole Flyway schema owner (§12); reuses the
# wc-api image.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wc-migration
  namespace: wc
  labels:
    app.kubernetes.io/part-of: wc
    app.kubernetes.io/component: migration
  annotations:
    eks.amazonaws.com/role-arn: ${IRSA_MIGRATION_ROLE_ARN}
